[package]
name = "twind"
version = "0.1.0"
edition = "2024"
description = "Sense Twin service: everything that talks to real devices lives here"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "SenseTwin"
path = "src/main.rs"

[dependencies]
twin_proto = { path = "../twin_proto" }
twin_control_proto = { path = "../twin_control_proto" }
# Default features pull aws-lc-rs, which needs cmake and nasm. ring already builds here via ureq.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
sha2 = "0.11"
x509-parser = "0.18"
httparse = "1"
serde_json = "1"
crossbeam-channel = "0.5"

[target.'cfg(windows)'.dependencies]
windows-service = "0.8"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_NetManagement",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
] }

[dev-dependencies]
twin_mock = { path = "../twin_mock" }
