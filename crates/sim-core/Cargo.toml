[package]
name = "sim-core"
version = "0.1.0"
edition = "2024"
description = "Sense Sim simulation core: analysis catalogue, meshing, solver decks, result readers and jobs. No Bevy or egui, so its tests need no window."

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
sha2 = "0.10"
ureq = "3"
rayon = "1"
wgpu = { version = "30", default-features = false, features = ["std", "wgsl", "vulkan", "dx12"] }
pollster = "0.4"
quick-xml = "0.41"
bytemuck = { version = "1", features = ["derive"] }

[dev-dependencies]
naga = { version = "30", default-features = false, features = ["wgsl-in"] }

[profile.dev.package."*"]
opt-level = 2

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }
