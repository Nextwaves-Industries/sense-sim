[package]
name = "proof"
version = "0.1.0"
edition = "2024"
description = "The prediction loop behind Sense Sim's outcome recipes: predict with a range, measure, calibrate, predict again, decide. Pure maths with no solver, UI or engine dependency, so its tests build in seconds."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.test]
opt-level = 3
