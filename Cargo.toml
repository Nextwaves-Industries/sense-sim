[package]
name = "sense_sim"
version = "1.5.0"
edition = "2024"
description = "Sense Sim - SimReady USD asset viewer and scene builder"

[[bin]]
name = "SenseSim"
path = "src/main.rs"

[workspace]
exclude = ["third_party"]
members = [
    "crates/sim-core",
    "crates/antenna_core",
    "crates/proof",
    "crates/ifc",
    "crates/twin_proto",
    "crates/twin_control_proto",
    "crates/twin_probes",
    "crates/twin_mock",
    "crates/twind",
    "crates/console",
    "crates/collector",
]

[[example]]
name = "design_host"
required-features = ["design"]

[[example]]
name = "s4_corpus"
required-features = ["design"]

[features]
default = ["antenna-studio", "design"]
# The embedded SolidCraft CAD workspace. Off = faster dev builds, no CAD or simulation.
design = ["dep:solidcraft-ui-egui", "dep:solidcraft-engine", "dep:solidcraft-gpu", "dep:egui", "dep:egui-wgpu", "dep:pollster"]
# Antenna Studio: the antenna design workspace (see src/antenna).
antenna-studio = []

[dependencies]
sim-core = { path = "crates/sim-core" }
solidcraft-engine = { path = "third_party/solidcraft/crates/engine", optional = true }
solidcraft-gpu = { path = "third_party/solidcraft/crates/gpu", optional = true }
solidcraft-ui-egui = { path = "third_party/solidcraft/crates/ui-egui", optional = true }
egui = { version = "0.36", default-features = false, optional = true }
egui-wgpu = { version = "0.36", optional = true }
pollster = { version = "0.4", optional = true }
antenna_core = { path = "crates/antenna_core" }
ifc = { path = "crates/ifc" }
proof = { path = "crates/proof" }
bevy = "0.20"
bevy_egui = "0.43"
openusd = { version = "0.8", features = ["mmap"] }
openusd-schemas = { version = "0.8", features = ["geom", "shade"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "ico", "webp", "bmp"] }
serde_json = "1"
anyhow = "1"
crossbeam-channel = "0.5"
rayon = "1"
rfd = "0.15"
ureq = "3"
winit = { version = "0.30", default-features = false }
serde = { version = "1", features = ["derive"] }
base64 = "0.22"
tiny_http = "0.12"
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "ndarray", "load-dynamic", "directml", "api-24"] }
ndarray = "0.17"
# Same wgpu as Bevy; used to list the GPUs for Settings → Graphics.
wgpu = { version = "30", default-features = false }
tokenizers = { version = "0.22", default-features = false, features = ["fancy-regex"] }
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
kamadak-exif = "0.6"
knowledge = { path = "crates/knowledge" }

[dev-dependencies]
resvg = "0.49"

[build-dependencies]
winresource = "0.1"

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
debug = false

# A workspace member, so the rule above misses it, and its solvers are the slow part.
[profile.dev.package.antenna_core]
opt-level = 3
debug = false

# truck's debug-only checks reject valid geometry (seam edges, closed edges), so the kernel stack
# never builds with them. Listed one by one: `"*"` would also drop wgpu's validation in dev builds.
[profile.dev.package.matext4cgmath]
debug-assertions = false
[profile.dev.package.solidcraft-derive]
debug-assertions = false
[profile.dev.package.solidcraft-doc]
debug-assertions = false
[profile.dev.package.solidcraft-engine]
debug-assertions = false
[profile.dev.package.solidcraft-geom]
debug-assertions = false
[profile.dev.package.solidcraft-gpu]
debug-assertions = false
[profile.dev.package.solidcraft-io]
debug-assertions = false
[profile.dev.package.solidcraft-kernel]
debug-assertions = false
[profile.dev.package.solidcraft-render]
debug-assertions = false
[profile.dev.package.solidcraft-sketch]
debug-assertions = false
[profile.dev.package.solidcraft-space-mouse]
debug-assertions = false
[profile.dev.package.solidcraft-ui-egui]
debug-assertions = false
[profile.dev.package.truck-base]
debug-assertions = false
[profile.dev.package.truck-derivers]
debug-assertions = false
[profile.dev.package.truck-geometry]
debug-assertions = false
[profile.dev.package.truck-geotrait]
debug-assertions = false
[profile.dev.package.truck-meshalgo]
debug-assertions = false
[profile.dev.package.truck-modeling]
debug-assertions = false
[profile.dev.package.truck-polymesh]
debug-assertions = false
[profile.dev.package.truck-shapeops]
debug-assertions = false
[profile.dev.package.truck-stepio]
debug-assertions = false
[profile.dev.package.truck-topology]
debug-assertions = false

[profile.release]
debug = false
strip = true

# SolidCraft's local fixes to third-party crates. Patches are not inherited from a dependency's
# workspace, so they are repeated here. winit and accesskit_macos are left out on purpose: they
# only serve eframe on Wayland and macOS, and patching winit would also change Bevy's.
[patch.crates-io]
truck-geometry = { path = "third_party/solidcraft/vendor/truck-geometry" }
truck-shapeops = { path = "third_party/solidcraft/vendor/truck-shapeops" }
truck-stepio = { path = "third_party/solidcraft/vendor/truck-stepio" }
truck-meshalgo = { path = "third_party/solidcraft/vendor/truck-meshalgo" }
matext4cgmath = { path = "third_party/solidcraft/vendor/matext4cgmath" }
egui-wgpu = { path = "third_party/solidcraft/vendor/egui-wgpu" }

# Ties the managed OpenEMS process to Sense Sim (Job Object: killed when we exit).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }
