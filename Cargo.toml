[package]
name = "sense_sim"
version = "1.13.0"
edition = "2024"
license = "MIT"
description = "Sense Sim - SimReady USD asset viewer and scene builder"

[[bin]]
name = "SenseSim"
path = "src/main.rs"

[workspace]
members = [
    "crates/sim-core",
    "crates/antenna_core",
    "crates/proof",
    "crates/ifc",
    "crates/twin_proto",
    "crates/twin_control_proto",
    "crates/twin_probes",
    "crates/twin_mock",
    "crates/twind",
    "crates/console",
    "crates/collector",
]

[features]
default = ["antenna-studio"]
# Antenna Studio: the antenna design workspace (see src/antenna).
antenna-studio = []

[dependencies]
sim-core = { path = "crates/sim-core" }
antenna_core = { path = "crates/antenna_core", features = ["gpu"] }
ifc = { path = "crates/ifc" }
proof = { path = "crates/proof" }
# Read-only device data. Never add twin_control_proto here: see crates/twin_proto/tests/control_boundary.rs.
twin_proto = { path = "crates/twin_proto" }
bevy = "0.20"
bevy_egui = "0.43"
openusd = { version = "0.8", features = ["mmap"] }
openusd-schemas = { version = "0.8", features = ["geom", "shade"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "ico", "webp", "bmp"] }
serde_json = "1"
anyhow = "1"
crossbeam-channel = "0.5"
rayon = "1"
rfd = "0.15"
ureq = "3"
winit = { version = "0.30", default-features = false }
serde = { version = "1", features = ["derive"] }
base64 = "0.22"
tiny_http = "0.12"
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "ndarray", "load-dynamic", "directml", "api-24"] }
ndarray = "0.17"
# Same wgpu as Bevy; used to list the GPUs for Settings → Graphics.
wgpu = { version = "30", default-features = false }
tokenizers = { version = "0.22", default-features = false, features = ["fancy-regex"] }
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
kamadak-exif = "0.6"
knowledge = { path = "crates/knowledge" }
semver = "1"
sha2 = "0.10"
tempfile = "3"

[dev-dependencies]
resvg = "0.49"

[build-dependencies]
winresource = "0.1"

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
debug = false

# A workspace member, so the rule above misses it, and its solvers are the slow part.
[profile.dev.package.antenna_core]
opt-level = 3
debug = false

[profile.release]
debug = false
strip = true

# Ties the managed OpenEMS process to Sense Sim (Job Object: killed when we exit).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }
